<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="0.6" stop-color="#0f0a24"/>
      <stop offset="1" stop-color="#05030f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#312e81"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a78bfa" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ring)" stroke-width="6" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 14"/>
  <!-- ojo de Horus -->
  <g filter="url(#glow)">
    <path d="M70 256 Q256 108 442 256 Q256 404 70 256 Z" fill="#0b0720" stroke="url(#ring)" stroke-width="9" stroke-linejoin="round"/>
    <path d="M70 256 L38 236 M442 256 L474 236" stroke="url(#ring)" stroke-width="9" stroke-linecap="round"/>
    <path d="M256 340 Q250 392 214 420 Q246 418 268 396" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 168 Q220 132 168 130" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <circle cx="256" cy="256" r="74" fill="url(#iris)"/>
    <circle cx="256" cy="256" r="74" fill="none" stroke="#f0abfc" stroke-width="3" opacity="0.7"/>
    <circle cx="256" cy="256" r="32" fill="#05030f"/>
    <circle cx="236" cy="236" r="13" fill="#ffffff" opacity="0.95"/>
    <circle cx="276" cy="276" r="6" fill="#ffffff" opacity="0.7"/>
  </g>
  <!-- particulas -->
  <g fill="#e9d5ff">
    <circle cx="96" cy="120" r="3"/><circle cx="420" cy="96" r="2.5"/><circle cx="450" cy="380" r="3"/>
    <circle cx="80" cy="400" r="2.5"/><circle cx="330" cy="70" r="2"/><circle cx="150" cy="460" r="2"/>
  </g>
</svg>
