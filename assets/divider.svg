<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="0.75" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="40" y="11" width="920" height="2" fill="url(#g)" opacity="0.55"/>
  <g filter="url(#glow)">
    <circle cy="12" r="5" fill="#fff">
      <animate attributeName="cx" values="40;960;40" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#22d3ee;#a78bfa;#f472b6;#a78bfa;#22d3ee" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#a78bfa">
    <circle cx="500" cy="12" r="3.5"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="12" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="12" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
